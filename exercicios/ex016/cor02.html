<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degradê em CSS</title>
    <style>
        body {
            background-image: linear-gradient(to right, #8203FD 10%, #D700E5, #FC00C9, #FE0175, #FF9100, #FFC700);
            background-attachment: fixed;
        }
        h1 {
            background-image: linear-gradient(to left, #70FADC, #70BEFA, #7093FA, #5855FA);
            border-radius: 25px;
            border-style: double;
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
    <h2>Veja o texto &darr;</h2>
    <hr color="black">
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Et sapiente, mollitia eveniet ullam quasi unde, animi fugiat itaque dicta sed officia illum voluptatibus amet blanditiis consectetur quidem modi ea id!</p> 
</body>
</html>
